<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>
<body>
    <h1>Table</h1>
    <table border="1">
        <tr>
            <th>S.No</th>
            <th>Item</th>
            <th>price</th>
        </tr>
        <tr>
            <td>1</td>
            <td>shampoo</td>
            <td>400</td>
        </tr>
        <tr>
            <td>2</td>
            <td>conditioner</td>
            <td>200</td>
        </tr>
        <tr>
            <td>3</td>
            <td colspan="2">cake</td>
            <!-- <td>350</td> -->
        </tr>
        <tr>
            <td>2</td>
            <td rowspan="2">conditioner</td>
            <td>200</td>
        </tr>
        <tr>
            <td>3</td>
            <td>350</td>
        </tr>
    </table>
</body>
</html>
