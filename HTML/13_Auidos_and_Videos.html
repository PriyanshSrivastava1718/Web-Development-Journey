<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audios and Videos</title>
</head>
<body>
    <h1>Audios first and it is used using &lt;audio&gt; tag</h1>
    <audio src="a.mp3" controls></audio>
    <!--another way to represent it is -->
    <br><br>
    <audio controls>
        <source src="a.mp3" type="audio/mpeg">
    </audio>
    <br><br>
    <h1>Time for a videooooooooo tag = &lt;video&gt;</h1>
    <p>WIDTH AND HEIGHT IS ALSO USED HERE AS VIDEO IS A VIDEO BEING PLAYED UNLIKE AUDIO <br>ill attach my intro video here/p>
    <br>
    <video width="566" height="366" controls>
        <source src="intro.mp4">
        vdo not supported on your browser
    </video>
</body>
</html>
