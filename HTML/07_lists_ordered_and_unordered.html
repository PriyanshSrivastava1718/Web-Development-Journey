<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists: ordered and unordered</title>
</head>

<body>
    <h1>Unordered Lists</h1>
    <ul>
        Shopping list
        <li>onions</li>
        <li>potato</li>
        <li>chips</li>
    </ul>
    <ol>
        ordered Lists
        <li>wake up</li>
        <li>brush your teeths</li>
        <li>bath</li>
    </ol>
    <dl>
        <dt>CSS</dt>
        <dd>a markup language to design a html file</dd>
    </dl>
    <!--NESTED LIST-->
    <br><br>
    <h2>nested list</h2>
    <ol>
        <li>fruits</li>
        <ul>
            <li>mango</li>
            <li>apple</li>
            <li>guava</li>
        </ul>
        <li>vegetables</li>
        <ol>
            <li>potato</li>
            <li>tomato</li>
        </ol>
    </ol>
</body>

</html>
